<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="induxsoft.controls.js"></script>
    <script src="induxsoft.controls.editable.js"></script>
    <script src="induxsoft.controls.opcanva.js"></script>
    <title>Induxsoft Web Components</title>
</head>
<body style="font-family: monospace;display: flex; flex-direction: column; max-height: 100vh; flex-wrap: wrap; align-content: start;">
    <div style="max-width: 30rem; padding: 8px 16px; border: 1px solid #DDD;border-radius: 5px; padding-bottom: 32px; margin:4px;">
        <h3>Edit Select</h3>
        <!--
            [PARAMS: edit-select]
            ----------------------------------------------------------------------------------------------
            - edit-options      (optional): Establece que las opciones puedan ser editables (def: false)
            - manual-text       (optional): Establece el texto a mostrar para la opción editable (def: Escribir manualmente...)
            - control-styles    (opcional): Establece los estilos personalizados que se le aplicarán al control (ej: input{border:1px solid red;})
        -->
        <edit-select id="micontrol1" name="opcion" edit-options="true" manual-text="Editar manualmente" value="" control-styles="">
            <option value="1">Opción 1</option>
            <option value="2">Opción 2</option>
            <option value="3">Opción 3</option>
            <option >Opción 4</option>
        </edit-select>
    </div>
    <div style="max-width: 30rem; padding: 8px 16px; border: 1px solid #DDD;border-radius: 5px; padding-bottom: 32px; margin:4px;">
        <h3>Input Key</h3>
        <!--
            [PARAMS: input-key]
            ----------------------------------------------------------------------------------------------
            - data-key              (required): Establece el campo a guardar al seleccionar un registro
            - data-search           (required): Establece el campo a considerar en la busqueda de un registro
            - data-text             (optional): Establece el campo a mostrar en la descripción del registro seleccionado
            - data-value            (optional): Establece los datos a usar en la selección de registros (ej: [{sys_pk:1,codigo:'001',nombre:'Bob'}, ...])
            - data-source           (optional): Establece el endpoint para la obtención de registros
            - columns               (opcional): Establece los campos a mostrar en la tabla de resultados de busqueda (ej: "codigo,nombre", def: valores de todos los campos)
            - colcaptions           (opcional): Establece los encabezados de la tabla de resultados de busqueda (ej: "Código, Nombre", def: nombre de todos los campos)
            - add-url               (opcional): Establece el endpoint para la adición de nuevos registros
            - edit-url              (opcional): Establece el endpoint para la edición del registro seleccionado
            - search-value          (opcional): Texto a mostrar por defecto en el campo de busqueda
            - text-value            (opcional): Texto a mostrar por defecto en el campo de descrición
            - box-title-text        (opcional): Texto a mostrar en el títilo del buscador (def: Seleccione un Registro)
            - box-placeholder-text  (opcional): Texto a mostrar en el placeholder del buscador (def: Buscar...)
            - box-nodata-text       (opcional): Texto a mostrar cuando no haya datos para mostrar (def: Sin registros)
            - disabled              (opcional): Desabilita los controles del componente cuando es igual a "true" (def: "false")
            - required              (opcional): Establece que el campo tenga datos antes de enviarse el formulario (def: "false")
            - control-styles        (opcional): Establece los estilos personalizados que se le aplicarán al control (ej: input{border:1px solid red;})

            Claves en la URL:
            - @search               (opcional): Valor del parámetro a buscar establecido en el campo de busqueda del componente
            - @key                  (opcional): Valor (data-key) del registro seleccionado
            - @text                 (opcional): Descripción (data-text) del registro seleccionado
        -->
        <styles-manager css="bootstrap4.css" id="styles1">
            <web-component type="input-key" >
                <class-element type="input1" class="formcontrols" style="background-color: #DDD;"/>
            </web-componet>
        </styles-manager>

        <input-key 
            id="micontrol2"
            name="cliente"
            data-key="sys_pk"
            data-search="codigo"
            data-text="nombre"
            data-value='[{"sys_pk":1, "codigo":"001", "nombre":"Bob"}]'
            data-source=""
            columns="codigo,nombre"
            colcaptions="Código,Nombre"
            add-url=""
            edit-url=""
            search-value=""
            text-value=""
            box-title-text="Seleccione un cliente"
            box-placeholder-text="Buscar cliente"
            box-nodata-text="No se encontraron clientes"
            disabled="false"
            required="true"
            styles-manager="styles1"
            class-input1="formcontrols"
            control-styles="">
            
        </input-key>
    </div>
    <div style="max-width: 30rem; padding: 8px 16px; border: 1px solid #DDD;border-radius: 5px; padding-bottom: 32px; margin:4px;">
        <h3>Check List</h3>
        <!--
            [PARAMS: check-list]
            ----------------------------------------------------------------------------------------------
            - data              (opcional): datos de la lista
            - data-locked       (opcional): Elementos marcados ya no pueden desmarcarse (true/false, def: false)
            - data-done-style   (opcional): Visualización de elementos marcados: 0-Permanecen en su sitio, 1-Desaparecen, 2-Se apilan en una lista en la parte inferior (def: 0)
            - can-remove        (opcional): Pueden eliminarse elementos (true/false, def: false)
            - can-edit          (opcional): Pueden editarse elementos (true/false, def: false)
            - can-move          (opcional): Pueden moverse elementos (true/false, def: false)
            - can-check         (opcional): Pueden marcarse como completados o actualizar su progreso (true/false, def: true)
        -->
        <check-list 
            id="micontrol3"
            data=""
            data-locked="false" 
            data-done-style="1" 
            can-remove="true" 
            can-edit="true" 
            can-move="true" 
            can-check="true"
        />
    </div>
    <div style="max-width: 30rem; padding: 8px 16px; border: 1px solid #DDD;border-radius: 5px; padding-bottom: 32px; margin:4px; min-height: 35vh;">
        <h3>Stack Edit</h3>
        <!--
            [PARAMS: stack-edit]
            ----------------------------------------------------------------------------------------------
            - data              (opcional): datos de la pila
            - caption-a         (opcional): Campo a mostrar en la esquina superior izquierda de los elementos de la pila
            - caption-b         (opcional): Campo a mostrar en la esquina superior derecha de los elementos de la pila
            - caption-c         (opcional): Campo a mostrar en la esquina inferior izquierda de los elementos de la pila
            - caption-d         (opcional): Campo a mostrar en la esquina inferior derecha de los elementos de la pila
            - title             (opcional): Campo a mostrar como título de los elementos de la pila
            - subtitle          (opcional): Campo a mostrar como subtítulo de los elementos de la pila
            - color-field       (opcional): Color del texto de los elementos de la pila (def: #000)
            - backcolor-field   (opcional): Color de fondo de los elementos de la pila (def: #FFF)
            - control-styles    (opcional): Establece los estilos personalizados que se le aplicarán al control (ej: input{border:1px solid red;})
            - styles-field      (opcional): Especifica el campo en el objeto del array (data) con los estilos para cada contenedor de los items de la pila
        -->
        <stack-edit 
            id="micontrol4"
            caption-a="a" 
            caption-b="b"
            caption-c="c"
            caption-d="d" 
            title="title" 
            subtitle="subtitle" 
            color-field="#000" 
            backcolor-field="#FFF"
            styles-field="styles"
            data='[{"a":"01-01-2001","b":"Activo","c":"Verde","d":"Uno","title":"Item Verde","subtitle":"Este es un item de color Verde"}]'
        />
    </div>
    <div style="max-width: 30rem; padding: 8px 16px; border: 1px solid #DDD;border-radius: 5px; padding-bottom: 32px; margin:4px;">
        <div style="display: flex; gap: 8px; padding: 1rem 0; align-items: center;">
            <h3 style="margin: 0;">Edit Table</h3>
            <button onclick="document.querySelector('#micontrol5').AddRow();" style="color: #888;">+</button>
        </div>
        <div style="max-height: 30vh; display: flex;">
            <!--
            [PARAMS: edit-table]
            ----------------------------------------------------------------------------------------------
            - data              (opcional): datos de la tabla (ej: [{"title1":"value1"},...])
            - control-styles    (opcional): Establece los estilos personalizados que se le aplicarán al control (ej: input{border:1px solid red;})

            [PARAMS:edit-th]
            ----------------------------------------------------------------------------------------------
            - type      (opcional): Tipo de celda: Text,Number,Date,DateTime,Memo,Check,Select,Custom,NoEditable (def:Text)
            - field     (opcional): Nombre del campo donde se guardará el valor de la celda
            - default   (opcional): Valor por defecto de la celda al iniciarse
            - options   (opcional): Datos de las opciones de una celda tipo Select (ej: {"a":"Opción 1","b":"Opción 2","c":"Opción 3"})
        -->
            <edit-table id="micontrol5" style="width: 100%;">
                <edit-thead>
                    <edit-tr>
                        <edit-th type="Text" field="uno">Título 1</edit-th>
                        <edit-th type="Text" field="dos" default="Valor 2">Título 2</edit-th>
                        <edit-th type="Select" keyfield="opcion_clave" options='{"a":"Opción 1","b":"Opción 2","c":"Opción 3"}'>Título 2</edit-th>
                        <edit-th type="Text" field="cuatro">Título 4</edit-th>
                    </edit-tr>
                </edit-thead>
            </edit-table>
        </div>
    </div>
    <div style="max-width: 30rem; padding: 8px 16px; border: 1px solid #DDD;border-radius: 5px; padding-bottom: 32px; margin:4px;">
        <h3>Op Canva</h3>
        <div style="height: 40vh; display: flex;">
            <op-canva
                id="micontrol6"
                scale="354"
                dpi="96"
                zoom="110"
                design="true"
                unit="cm"
                fit="1"
                lx="5000"
                ly="2500"
                background-color="#F5F5F5"
                background-pic="https://images.vexels.com/media/users/3/158250/isolated/preview/6979f96bd8c12732ca0b21f9d784e885-diseno-de-cuadricula-de-puntos-cuadrados.png"
                data='[{"x":100,"y":100,"lx":2000,"ly":1000,"id":"556d852dbee9486ab432eb04411a2df5","overlapping":false,"locked":false,"sizable":true,"html":"<h4>HTML1</h4>","title":"My Title1","subtitle":"Subtitle text1","caption-a":"A1","caption-b":"B1","caption-c":"C1","caption-d":"D1","background-color":"","background-image":"https://cdn-icons-png.flaticon.com/256/6544/6544002.png","color":"#000"},
                {"x":1500,"y":1500,"lx":1500,"ly":800,"id":"556d852dbee9486ab432eb04411a2df6","overlapping":false,"locked":false,"sizable":true,"html":"<h4>HTML2</h4>","title":"My Title2","subtitle":"Subtitle text2","caption-a":"A2","caption-b":"B2","caption-c":"C2","caption-d":"D2","background-color":"#FFF","color":"red"}]'>
            </op-canva>
        </div>
    </div>
    <div style="max-width: 30rem; padding: 8px 16px; border: 1px solid #DDD;border-radius: 5px; padding-bottom: 32px; margin:4px;">
        <style>
            .induxsoft-formcontrols {
                border: none;
                outline: 1px solid #ced4da;
                display: block;
                width: 100%;
                padding: 0.375rem 0.75rem;
                font-size: 1rem;
                font-weight: 400;
                line-height: 1.5;
                color: #212529;
                background-color: #fff;
                background-clip: padding-box;
                appearance: none;
                transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
            }
            .induxsoft-formcontrols:disabled,
            .induxsoft-formcontrols[readonly] {
                background-color: #e9ecef;
                opacity: 1;
            }
            .induxsoft-buttons {
                display: inline-block;
                font-weight: 400;
                line-height: 1.5;
                color: #212529;
                text-align: center;
                text-decoration: none;
                vertical-align: middle;
                cursor: pointer;
                -webkit-user-select: none;
                -moz-user-select: none;
                user-select: none;
                background-color: #FFF;
                outline: 1px solid #ced4da;
                border: none;
                padding: 0.375rem 0.75rem;
                font-size: 1rem;
                transition: color 0.15s ease-in-out, background-color 0.15s ease-in-out, border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
            }
            .induxsoft-buttons:hover {
                color: #212529;
                background-color: #F5F5F5;
            }
            .induxsoft-formselect {
                display: block;
                width: 100%;
                padding: 0.375rem 2.25rem 0.375rem 0.75rem;
                -moz-padding-start: calc(0.75rem - 3px);
                font-size: 1rem;
                font-weight: 400;
                line-height: 1.5;
                color: #212529;
                background-color: #fff;
                background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3e%3cpath fill='none' stroke='%23343a40' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M2 5l6 6 6-6'/%3e%3c/svg%3e");
                background-repeat: no-repeat;
                background-position: right 0.75rem center;
                background-size: 16px 12px;
                border: none;
                outline: 1px solid #ced4da;
                -webkit-appearance: none;
                -moz-appearance: none;
                appearance: none;
            }
            .induxsoft-formlabels {
                margin-bottom: 0.5rem;
            }
        </style>

        <h3>Inputs</h3>
        <div>
            <label class="induxsoft-formlabels">Inputs</label>
            <input class="induxsoft-formcontrols" type="text" placeholder="Placeholder">
            <input class="induxsoft-formcontrols" type="checkbox" name="" id="">
            <input class="induxsoft-formcontrols" type="color" name="" id="">
            <input class="induxsoft-formcontrols" type="file" name="" id="">
            <input class="induxsoft-formcontrols" type="search" name="" id="" value="Search">
            <input class="induxsoft-formcontrols" type="password" name="" id="" value="Password">
            <input class="induxsoft-formcontrols" type="radio" name="" id="">
            <input class="induxsoft-formcontrols" type="range" name="" id="">
            <input class="induxsoft-formcontrols" type="week" name="" id="">
            <input class="induxsoft-formcontrols" type="date">
            <input class="induxsoft-formcontrols" type="number" value="0">
            <textarea class="induxsoft-formcontrols" name="" id="" cols="30" rows="10">Textarea</textarea>
            <select class="induxsoft-formselect" name="" id="">
                <option value="1">1</option>
                <option value="2">2</option>
            </select>
            <input class="induxsoft-buttons" type="submit" value="Botón">
        </div>
    </div>
    <style>
        @media screen and (max-width: 600px) {
            body{ flex-wrap: nowrap !important; }
        }
    </style>
</body>
