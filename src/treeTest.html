<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EdiTable Demo</title>
    <script src="induxsoft.controls.editable.js"></script>
</head>
<body style="font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;">
    <div style="max-width: 100vw; padding: 8px 16px; border: 1px solid #DDD;border-radius: 5px; padding-bottom: 32px; margin:4px;">
        
        <div style="display: flex; gap: 8px; padding: 1rem 0; align-items: center;">
            <h3 style="margin: 0;">Edit Table</h3>
            <button onclick="document.querySelector('#tabla-demo').AddRow();" style="color: #888;">+</button>
            <button onclick="copyData()" style="color: #000;">Copiar datos</button>
            <button onclick="order()" style="color: #000;">Ordenar</button>
            <!-- <button onclick="expand()" style="color: #000;">Expandir</button>
            <button onclick="collapse()" style="color: #000;">Contraer</button> -->
        </div>

        <div style="max-height: 50vh; display: flex;">
            <edit-table id="tabla-demo" show-tree="false" parentkey="parent" key="name" style="width: 100%;" data='[{"name": "Sesenta","value": 60,"even": "Si","notes": "","parent": "Numeros"},{"name": "Cincuenta y cuatro punto uno","value": 54.1,"even": "No","notes": "","parent": "Cincuenta y cuatro"},{"name": "Diez","value": 10,"even": "Si","notes": "","parent": "Numeros"},{"name": "Noventa y cinco","value": 95,"even": "No","notes": "","parent": "Noventa"},{"name": "Veinte","value": 20,"even": "Si","notes": "","parent": "Numeros"},{"name": "Cincuenta","value": 50,"even": "Si","notes": "","parent": "Numeros"},{"name": "Noventa y siete","value": 97,"even": "No","notes": "","parent": "Noventa"},{"name": "Numeros","value": 100,"even": "No","notes": ""},{"name": "Ochenta y nueve","value": 89,"even": "No","notes": "","parent": "Ochenta"},{"name": "Setenta","value": 70,"even": "Si","notes": "","parent": "Numeros"},{"name": "Cuarenta","value": 40,"even": "Si","notes": "","parent": "Numeros"},{"name": "Treinta y nueve","value": 39,"even": "No","notes": "","parent": "Treinta"},{"name": "Dos","value": 2,"even": "Si","notes": "","parent": "Cero"},{"name": "Treinta","value": 30,"even": "Si","notes": "","parent": "Numeros"},{"name": "Cincuenta y cuatro","value": 54,"even": "Si","notes": "","parent": "Cincuenta"},{"name": "Noventa","value": 90,"even": "Si","notes": "","parent": "Numeros"},{"name": "Seis","value": 6,"even": "Si","notes": "","parent": "Cero"},{"name": "Cuarenta y dos","value": 42,"even": "Si","notes": "","parent": "Cuarenta"},{"name": "Cinco","value": 5,"even": "No","notes": "","parent": "Cero"},{"name": "Cero","value": 0,"even": "No","notes": "","parent": "Numeros"},{"name": "Ochenta","value": 80,"even": "Si","notes": "","parent": "Numeros"},{"name": "Nueve","value": 9,"even": "No","notes": "","parent": "Cero"},{"name": "Catorce","value": 14,"even": "Si","notes": "","parent": "Diez"},{"name": "Simbolos","value": "*-*","even": "No","notes": ""},{"name": "Ochenta y ocho","value": 88,"even": "Si","notes": "","parent": "Ochenta"},{"name": "Guión","value": "-","even": "No","notes": "","parent": "Simbolos"}]'>
                <edit-thead>
                    <edit-tr>
                        <edit-th type="Number" field="value">Valor</edit-th>
                        <edit-th type="Text" field="name">Nombre</edit-th>
                        <edit-th type="Select" field="even" options='{"No":"No","Si":"Si"}'>¿Es par?</edit-th>
                        <edit-th type="Memo" field="notes">Notas</edit-th>
                    </edit-tr>
                </edit-thead>
            </edit-table>
        </div>
    </div>

    <script>
        var table = document.querySelector('#tabla-demo');
        
        document.addEventListener('DOMContentLoaded', () => 
        {
            table = document.querySelector('#tabla-demo');
        });

        function copyData()
        {
            navigator.clipboard.writeText(JSON.stringify(document.querySelector('#tabla-demo').DataArray)).then(()=>{
                console.log('¡Datos copiados al portapapeles!');
            }, ()=> {
                console.log('¡Ocurrió un error al copiar los datos!');
            });
        }
        function order()
        {
            table.ShowAsTree = true;
            table._printTreeData();
        }
        function expand()
        {
            table.ExpandRow();
        }
        function collapse()
        {
            table.CollapseRow();
        }
    </script>
</body>
</html>
