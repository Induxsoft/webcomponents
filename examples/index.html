<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../src/js/induxsoft.controls.js"></script>
    <script src="../src/js/induxsoft.controls.editable.js"></script>
    <script src="../src/js/induxsoft.controls.opcanva.js"></script>
    <title>Induxsoft Web Components</title>
</head>
<body style="font-family: monospace;display: flex; flex-direction: column; max-height: 100vh; flex-wrap: wrap; align-content: start;">
    <div style="max-width: 30rem; padding: 8px 16px; border: 1px solid #DDD; padding-bottom: 32px; margin:4px;">
        <h3>Edit Select</h3>
        <!--
            [PARAMS: edit-select]
            ----------------------------------------------------------------------------------------------
            - edit-options      (optional): Establece que las opciones puedan ser editables (def: false)
            - manual-text       (optional): Establece el texto a mostrar para la opción editable (def: Escribir manualmente...)
            - control-styles    (opcional): Establece los estilos personalizados que se le aplicarán al control (ej: input{border:1px solid red;})
        -->
        <edit-select id="micontrol1" name="opcion" edit-options="true" manual-text="Editar manualmente" value="" control-styles="">
            <option value="1">Opción 1</option>
            <option value="2">Opción 2</option>
            <option value="3">Opción 3</option>
            <option >Opción 4</option>
        </edit-select>
    </div>
    <div style="max-width: 30rem; padding: 8px 16px; border: 1px solid #DDD; padding-bottom: 32px; margin:4px;">
        <h3>Input Key</h3>
        <!--
            [PARAMS: input-key]
            ----------------------------------------------------------------------------------------------
            - data-key              (required): Establece el campo a guardar al seleccionar un registro
            - data-search           (required): Establece el campo a considerar en la busqueda de un registro
            - data-text             (optional): Establece el campo a mostrar en la descripción del registro seleccionado
            - data-value            (optional): Esteblece el valor inicial del componente
            - data-source-array     (opcional): Establece los datos a usar en la selección de registros (ej: [{sys_pk:1,codigo:'001',nombre:'Bob'}, ...])
            - data-source           (optional): Establece el endpoint para la obtención de registros
            - columns               (opcional): Establece los campos a mostrar en la tabla de resultados de busqueda (ej: "codigo,nombre", def: valores de todos los campos)
            - colcaptions           (opcional): Establece los encabezados de la tabla de resultados de busqueda (ej: "Código, Nombre", def: nombre de todos los campos)
            - add-url               (opcional): Establece el endpoint para la adición de nuevos registros
            - edit-url              (opcional): Establece el endpoint para la edición del registro seleccionado
            - search-value          (opcional): Texto a mostrar por defecto en el campo de busqueda
            - text-value            (opcional): Texto a mostrar por defecto en el campo de descrición
            - box-title-text        (opcional): Texto a mostrar en el títilo del buscador (def: Seleccione un Registro)
            - box-placeholder-text  (opcional): Texto a mostrar en el placeholder del buscador (def: Buscar...)
            - box-nodata-text       (opcional): Texto a mostrar cuando no haya datos para mostrar (def: Sin registros)
            - disabled              (opcional): Desabilita los controles del componente cuando es igual a "true" (def: "false")
            - required              (opcional): Establece que el campo tenga datos antes de enviarse el formulario (def: "false")
            - control-styles        (opcional): Establece los estilos personalizados que se le aplicarán al control (ej: input{border:1px solid red;})
            - hidden-input          (opcional): Define si se crea un elemento input oculto fuera el web component para ser tomado por formularios o selectores (def: true)
            - buttons               (opcional): Establece una lista de objetos "botones" al que se puede acceder desde el DOM (ej: [{"content":"+","id":"btnAdd"}, ...])

            Claves en la URL:
            - @search               (opcional): Valor del parámetro a buscar establecido en el campo de busqueda del componente
            - @key                  (opcional): Valor (data-key) del registro seleccionado
            - @text                 (opcional): Descripción (data-text) del registro seleccionado
        -->
        <input-key 
            id="micontrol2"
            name="cliente"
            data-key="sys_pk"
            data-search="codigo"
            data-text="nombre"
            data-value='{"sys_pk":1, "codigo":"001", "nombre":"Bob"}'
            data-source-array='[{"sys_pk":1, "codigo":"001", "nombre":"Bob"}]'
            data-source=""
            columns="codigo,nombre"
            colcaptions="Código,Nombre"
            add-url=""
            edit-url=""
            search-value=""
            text-value=""
            box-title-text="Seleccione un cliente"
            box-placeholder-text="Buscar cliente"
            box-nodata-text="No se encontraron clientes"
            disabled="false"
            required="true"
            control-styles="">
        </input-key>
    </div>
    <div style="max-width: 30rem; padding: 8px 16px; border: 1px solid #DDD; padding-bottom: 32px; margin:4px;">
        <h3>Check List</h3>
        <!--
            [PARAMS: check-list]
            ----------------------------------------------------------------------------------------------
            - data              (opcional): datos de la lista ( ej: {"text":"Lista de compras","items":[{"id":"1","text":"3 Tomates","done":false,"_meta":{"percent":-1,"progress":"100"}},{"id":"2","text":"1 Cebolla","done":false,"_meta":{"percent":-1,"progress":"100"}},{"id":"3","text":"1 Pieza de chile","done":false,"_meta":{"percent":-1,"progress":"100"}},{"id":"4","text":"4 Huevos","done":false,"_meta":{"percent":-1,"progress":"100"}},{"id":"5","text":"4 Naranjas","done":true,"_meta":{"percent":-1,"progress":"100"}}]} )
            - data-locked       (opcional): Elementos marcados ya no pueden desmarcarse (true/false, def: false)
            - data-done-style   (opcional): Visualización de elementos marcados: 0-Permanecen en su sitio, 1-Se apilan en una lista en la parte inferior, 2-Desaparecen (def: 0)
            - can-remove        (opcional): Pueden eliminarse elementos (true/false, def: false)
            - can-edit          (opcional): Pueden editarse elementos (true/false, def: false)
            - can-move          (opcional): Pueden moverse elementos (true/false, def: false)
            - can-check         (opcional): Pueden marcarse como completados o actualizar su progreso (true/false, def: true)
            - can-add           (opcional): Pueden agregarse elementos a la lista (true/false, def: true)
            - radio-style       (opcional): Mecanismo de marcado por radio buttons (Si - No), Si es false o no se establece: el mecanismo será un check. (true/false, def:false)
        -->
        <check-list 
            id="micontrol3"
            data=""
            data-locked="false" 
            data-done-style="1" 
            can-remove="true" 
            can-edit="true" 
            can-move="true" 
            can-check="true"
            can-add="true"
            radio-style="false"
        />
    </div>
    <div style="max-width: 30rem; padding: 8px 16px; border: 1px solid #DDD; padding-bottom: 32px; margin:4px; min-height: 35vh;">
        <h3>Stack Edit</h3>
        <!--
            [PARAMS: stack-edit]
            ----------------------------------------------------------------------------------------------
            - data              (opcional): datos de la pila
            - caption-a         (opcional): Campo a mostrar en la esquina superior izquierda de los elementos de la pila
            - caption-b         (opcional): Campo a mostrar en la esquina superior derecha de los elementos de la pila
            - caption-c         (opcional): Campo a mostrar en la esquina inferior izquierda de los elementos de la pila
            - caption-d         (opcional): Campo a mostrar en la esquina inferior derecha de los elementos de la pila
            - title             (opcional): Campo a mostrar como título de los elementos de la pila
            - subtitle          (opcional): Campo a mostrar como subtítulo de los elementos de la pila
            - color-field       (opcional): Color del texto de los elementos de la pila (def: #000)
            - backcolor-field   (opcional): Color de fondo de los elementos de la pila (def: #FFF)
            - control-styles    (opcional): Establece los estilos personalizados que se le aplicarán al control (ej: input{border:1px solid red;})
            - styles-field      (opcional): Especifica el campo en el objeto del array (data) con los estilos para cada contenedor de los items de la pila
        -->
        <stack-edit 
            id="micontrol4"
            caption-a="a" 
            caption-b="b"
            caption-c="c"
            caption-d="d" 
            title="title" 
            subtitle="subtitle" 
            color-field="#000" 
            backcolor-field="#FFF"
            styles-field="styles"
            data='[{"a":"01-01-2001","b":"Activo","c":"Verde","d":"Uno","title":"Item Verde","subtitle":"Este es un item de color Verde"}]'
        />
    </div>
    <div style="max-width: 30rem; padding: 8px 16px; border: 1px solid #DDD; padding-bottom: 32px; margin:4px;">
        <div style="display: flex; gap: 8px; padding: 1rem 0; align-items: center;">
            <h3 style="margin: 0;">Edit Table</h3>
            <button onclick="document.querySelector('#micontrol5').AddRow();" style="color: #888;background-color:#FFF;border:none;outline:1px solid #DDD;padding:4px 8px;cursor:pointer;">+</button>
        </div>
        <div style="max-height: 30vh; display: flex;">
            <!--
                [PARAMS: edit-table]
                ----------------------------------------------------------------------------------------------
                - data              (opcional): datos de la tabla (ej: [{"title1":"value1"},...])
                - control-styles    (opcional): Establece los estilos personalizados que se le aplicarán al control (ej: input{border:1px solid red;})
                - show-tree         (opcional): Establece la vista de la tabla en arbol (true/false, def: false)
                - parentkey         (opcional): Campo que contiene el identificador de la fila padre (def: idp)
                - key               (opcional): Campo que contiene el identificador de la fila (def: id)
                - childs-field      (opcional): Campo que almacena una lista de filas hijas (def: __items)
                - can-move-row      (opcional): Establece que las filas puedan ser movidas (true/false, def: false, si show-tree es true def: true)
                - hidde-selector    (opcional): Oculta el selector de edición de la celda (true/false, def: false)
                - hide-row-selector (opcional): Oculta el selector de selección de la fila (true/false, def: false)
                - html-encode       (opcional): Escapa los caracteres especiales que entran en conflicto con la sintaxis HTML "<, >, ', etc." (true/false, def: false)
                - min-row-height    (opcional): Alto mínimo de las filas (ej: 10px)
                - max-row-height    (opcional): Alto máximo de las filas (ej: 10rem)
                - row-height        (opcional): Alto de las filas (ej: 10em)
                - cards-responsive  (opcional): Ver filas como tarjetas cuando el ancho en pixeles de la pantalla sea menor a 768px y todas las columna sean de tipo: NoEditable (true/false, def: false)

                [PARAMS:edit-th]
                ----------------------------------------------------------------------------------------------
                - type          (opcional): Tipo de celda: Text,Number,Date,DateTime,Memo,Check,Select,Custom,NoEditable (def:Text)
                - field         (opcional): Nombre del campo donde se guardará el valor de la celda
                - default       (opcional): Valor por defecto de la celda al iniciarse
                - options       (opcional): Datos de las opciones de una celda tipo Select (ej: {"a":"Opción 1","b":"Opción 2","c":"Opción 3"})
                - button        (opcional): Muestra un botón de función personalizada en la celda de la columna indicada (true/false, def:false)
                - buttondata    (opcional): Contenido HTML del botón de función personalizada (def: svg/icon(...))
                - textalign     (opcional): Establece la alineación del texto de la columna (ej: "start/left, center, end/right")
                - format        (opcional): Establece el formateo de números para columnas de tipo Number y NoEditable (true/false, def: false)
                - decs          (opcional): Cantidad de decimales a redondear cuando el atributo format es true
                - prefix        (opcional): Prefijo del contenido de la celda cuando el atributo format es true (ej: $)
                - sufix         (opcional): Sufijo del contenido de la celda cuando el atributo format es true (ej: MXN)
                - thousandssep  (opcional): Establece la separación de miles cuando el atributo format es true (true/false, def: false)
                - minwidth      (opcional): Ancho mínimo de la columna (ej: 10px)
                - maxwidth      (opcional): Ancho máximo de la columna (ej: 10rem)
                - width         (opcional): Ancho de la columna (ej: 10em)
                - maxlength     (opcional): Limita la cantidad de texto que puede introducirse en columnas de tipo Text y Memo (ej: 10)
            -->
            <edit-table id="micontrol5" style="width: 100%;">
                <edit-thead>
                    <edit-tr>
                        <edit-th type="Text" field="uno">Título 1</edit-th>
                        <edit-th type="Text" field="dos" default="Valor 2">Título 2</edit-th>
                        <edit-th type="Select" keyfield="opcion_clave" options='{"a":"Opción 1","b":"Opción 2","c":"Opción 3"}'>Título 3</edit-th>
                        <edit-th type="Text" field="cuatro">Título 4</edit-th>
                    </edit-tr>
                </edit-thead>
            </edit-table>
        </div>
    </div>
    <div style="max-width: 30rem; padding: 8px 16px; border: 1px solid #DDD; padding-bottom: 32px; margin:4px;">
        <h3>Op Canva</h3>
        <!--
            [PARAMS: op-canva]
            ----------------------------------------------------------------------------------------------
            - scale             (opcional) Valor numérico que representa la proporción de las dimensiones reales de un objeto a la representación gráfica del canva (def: 354)
            - dpi               (opcional) Valor numérico que representa la densidad de pixeles por pulgada en el canva (def: 96)
            - zoom              (opcional) Valor numérico que define el % de acercamiento o alejamiento de los objetos del canva (def: 100)
            - design            (opcional) Valor booleano que define si se podrá mover y redimensionar los objetos del canva (def: true)
            - unit              (opcional) Unidad de medida para representar objetos dentro del canva ["cm","m","in","ft","yd"] (def: cm)
            - fit               (opcional) Valor numérico que representa el ajuste de posición y tamaño de los objetos del canva (def: 1)
            - lx                Establece la longitud en 'X' o ancho del canva
            - ly                Establece la longitud en 'Y' o alto del canva
            - background-color  (opcional) Color de fondo del canva
            - background-pic    (opcional) URL de una imagen para visualizarse como el fondo del canva
            - data              (opcional) Datos de los objetos del canva
        -->
        <div style="height: 40vh; display: flex;">
            <op-canva
                id="micontrol6"
                scale="354"
                dpi="96"
                zoom="100"
                design="true"
                unit="m"
                fit="1"
                lx="50"
                ly="25"
                background-color="#F5F5F5"
                background-pic=""
                data='[{"x":4,"y":4,"lx":20,"ly":10,"id":"556d852dbee9486ab432eb04411a2df5","overlapping":true,"locked":false,"sizable":true,"html":"<h4>HTML1</h4>","title":"My Title1","subtitle":"Subtitle text1","caption-a":"A1","caption-b":"B1","caption-c":"C1","caption-d":"D1","background-color":"green","background-image":"","color":"#FFF"},
                {"x":13,"y":10,"lx":15,"ly":8,"id":"556d852dbee9486ab432eb04411a2df6","overlapping":false,"locked":false,"sizable":true,"html":"<h4>HTML2</h4>","title":"My Title2","subtitle":"Subtitle text2","caption-a":"A2","caption-b":"B2","caption-c":"C2","caption-d":"D2","background-color":"#FFF","color":"#555"}]'>
            </op-canva>
        </div>
    </div>
    <div style="max-width: 30rem; padding: 8px 16px; border: 1px solid #DDD; padding-bottom: 32px; margin:4px;">
        <h3>Date Range</h3>
        <!--
            [PARAMS: date-range]
            ----------------------------------------------------------------------------------------------
            - hidden-input-name-start   (opcional): Nombre del elemento input que guardará el valor de la fecha inicial
            - hidden-input-name-end     (opcional): Nombre del elemento input que guardará el valor de la fecha final
            - start                     (opcional): Fecha inicial en formato: YYYY-mm-dd
            - end                       (opcional): Fecha final en formato: YYYY-mm-dd
            - data                      (opcional): Objeto con la información de fecha final e inicial, ej: {"start":"2023-01-01","end":"2023-12-31"}
            - start-label               (opcional): Leyenda del input de fecha inicial (def: "Desde:")
            - end-label                 (opcional): Leyenda del input de fecha final (def: "Hasta:")
            - hide-labels               (opcional): Ocultar leyenda en los inputs de fecha (true/false, def: false)
        -->
        <date-range
            id="micontrol7"
            hidden-input-name-start="dt_start"
            hidden-input-name-end="dt_end"
            start=""
            end=""
            data='{"start":"2023-01-01","end":"2023-12-31"}'>
        </date-range>
    </div>
    <div style="max-width: 30rem; padding: 8px 16px; border: 1px solid #DDD; padding-bottom: 32px; margin:4px;">
        <h3>Safe Input</h3>
        <!--
            [PARAMS: safe-input]
            ----------------------------------------------------------------------------------------------
            - type          Tipo de input [text,email,number,textarea,date,time,datetime,select] (def: text)
            - data-select   (opcional) Objeto de datos clave-valor que establecen las opciones del input cuando es de tipo select, ej: {"val1":"text1", "val2":"text2"}
            - name          (opcional) Nombre del elemento input
            - placeholder   (opcional) Texto a mostrar en la caja de entrada (input).
            - hidden-input  (opcional) Define si se crea un elemento input oculto fuera el web component para ser tomado por formularios o selectores (def: false)
        -->
        <safe-input 
            id="micontrol8"
            type="text"
            input-name="nombre"
            value="Example value"
            placeholder="Safe-Input"
            hidden-input="true">
        </safe-input>
    </div>
    <div style="width: 30rem; padding: 8px 16px; border: 1px solid #DDD; padding-bottom: 32px; margin:4px;">
        <div style="display: flex; gap: 8px; align-items: center;">
            <h3>Media List</h3>
            <button onclick="console.log(document.querySelector('#micontrol9').getData());" style="color: #888;background-color:#FFF;border:none;outline:1px solid #DDD;padding:4px 8px;cursor:pointer;">Data</button>
        </div>
        <!--
            [PARAMS: media-list]
            ----------------------------------------------------------------------------------------------
            - data              (opcional): Datos de la lista (ej: [{"url":"imagen.png", "mini":"miniimagen.png", ...}, ...] )
            - can-arrange       (opcional): Pueden ordenar elementos (true/false, def: true)
            - can-drag          (opcional): Pueden arrastrar elementos (true/false, def: true)
            - can-drop          (opcional): Pueden colocar elementos (true/false, def: true)
            - can-delete        (opcional): Pueden eliminar elementos (true/false, def: true)
            - highlight-first   (opcional): Marcar el primer elemento (true/false, def: true)
            - media-prop        (opcional): Nombre del campo que indica la ubicación del recurso (def: url)
            - miniature-prop    (opcional): Nombre del campo que indica la ubicación de la miniatura del recurso (def: mini)
            - label-prop        (opcional): Nombre del campo para ser usado como etiqueta del recurso
            - back-color-media  (opcional): Color de fondo de los elementos media (ej: #FFF o white, def: #FFF)
            - outline-selected  (opcional): Remarcar el elemento seleccionado (true/false, def: false)
            - max-size-media    (opcional): Valor que se aplica al alto y ancho máximo de los elementos (ej: 12rem, def: 8rem)
        -->
        <media-list
            id="micontrol9"
            data='[
                {"url":"https://induxsoft.net/img/test/img1.png", "mini":"https://induxsoft.net/img/test/img1.png", "titulo":"título"}, 
                {"url":"https://induxsoft.net/img/test/img2.png", "mini":"https://induxsoft.net/img/test/img2.png", "titulo":"título medio"}, 
                {"url":"https://induxsoft.net/img/test/img3.png", "mini":"https://induxsoft.net/img/test/img3.png", "titulo":"título grande con mucho texto"}
            ]'
            can-arrange="true"
            can-drag="true"
            can-drop="true"
            can-delete="true"
            highlight-first="true"
            media-prop="url"
            label-prop="titulo"
            miniature-prop="mini"
            max-size-media="9rem">
        </media-list>
    </div>
    <div style="max-width: 30rem; padding: 8px 16px; border: 1px solid #DDD; padding-bottom: 32px; margin:4px;">
        <h3>Filter Text</h3>
        <form action="./index.html" method="get" id="form_test">
            <!--
                [PARAMS: filter-text]
                ----------------------------------------------------------------------------------------------
                - text-field        (opcional) Nombre del campo que se envía al lanzarse la búsqueda (def: "s")
                - placeholder       (opcional) Placeholder del cuadro de búsqueda
                - form              (opcional) Selector del formulario al que se realizará el submit (Si no se establece se busca el formulario más cercano)
                - value             (opcional) Valor inicial del filtro, si está esblecido, el componente está en estado 'filtro establecido (bloqueado)
                - url-parse         (opcional) Establece el valor inicial a través de los parámetros de la URL únicamente si el atributo value no está establecido (true/false, def:false)
                - auto-submit       (opcional) Envío del formulario al copletar el texto de búsqueda con la tecla Enter (true/false, def: false)
            -->
            <filter-text
                id="micontrol10"
                text-field=""
                placeholder="Buscar"
                form="#form_test"
                value=""
                url-parse="true"
                auto-submit="true">
            </filter-text>
        </form>
    </div>
    <div style="width: 70rem; padding: 8px 16px; border: 1px solid #DDD; padding-bottom: 32px; margin:4px;">
        <h3>Filter Date Range</h3>
        <form action="./index.html" method="get" id="form_test2">
            <filter-date-range
                mode-field="filter-mode"
                year-field="year"
                month-field="month"
                range-field="range"
                from-field="fromdate"
                to-field="todate"
                selection='{"filter-mode":"month", "year":2018, "month":3}'
                lastdays-options="15,30,45,60,90"
                years-options="2017,2018,2019,2020,2021,2022,2023,2024"
                custom-range="true"
                form=""
                auto-submit="false"
                label-months="Ver por cada mes"
                label-days="Últ. @lastdays días"
                label-custom="Personalizado"
                label-from="Desde:"
                label-to="Hasta:"
                month-names="Enero,Febrero,Marzo,Abril,Mayo,Junio,Julio,Agosto,Septiembre,Octubre,Noviembre,Diciembre">
            </filter-date-range>
        </form>
    </div>
    <style>
        @media screen and (max-width: 600px) {
            body{ flex-wrap: nowrap !important; }
        }
    </style>
</body>
</html>
