<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EdiTable Demo</title>
    <script src="../src/js/induxsoft.controls.editable.js"></script>
</head>
<body style="font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;">
    <div style="max-width: 100vw; padding: 8px 16px; border: 1px solid #DDD;border-radius: 5px; padding-bottom: 32px; margin:4px;background-color: #F5F5F5;">
        
        <div style="display: flex; gap: 8px; padding: 1rem 0; align-items: center;">
            <h3 style="margin: 0;">Edit Table</h3>
            <button onclick="document.querySelector('#tabla-demo').AddRow();" style="color: #888;">+</button>
            <button onclick="copyData()" style="color: #000;">Copiar datos</button>
            <button onclick="viewTree(false)" style="color: #000;">Vista normal</button>
            <button onclick="viewTree(true)" style="color: #000;">Vista en árbol</button>
            <button onclick="addIdent(false)" title="Disminuir identación" style="color: #000; display: flex; align-items: center; justify-content: center;">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-unindent" viewBox="0 0 16 16">
                    <path fill-rule="evenodd" d="M13 8a.5.5 0 0 0-.5-.5H5.707l2.147-2.146a.5.5 0 1 0-.708-.708l-3 3a.5.5 0 0 0 0 .708l3 3a.5.5 0 0 0 .708-.708L5.707 8.5H12.5A.5.5 0 0 0 13 8Z"/>
                    <path fill-rule="evenodd" d="M3.5 4a.5.5 0 0 0-.5.5v7a.5.5 0 0 0 1 0v-7a.5.5 0 0 0-.5-.5Z"/>
                  </svg>
            </button>
            <button onclick="addIdent(true)" title="Aumentar identación" style="color: #000; display: flex; align-items: center; justify-content: center;">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-indent" viewBox="0 0 16 16">
                    <path fill-rule="evenodd" d="M3 8a.5.5 0 0 1 .5-.5h6.793L8.146 5.354a.5.5 0 1 1 .708-.708l3 3a.5.5 0 0 1 0 .708l-3 3a.5.5 0 0 1-.708-.708L10.293 8.5H3.5A.5.5 0 0 1 3 8Z"/>
                    <path fill-rule="evenodd" d="M12.5 4a.5.5 0 0 1 .5.5v7a.5.5 0 0 1-1 0v-7a.5.5 0 0 1 .5-.5Z"/>
                  </svg>
            </button>
        </div>

        <div style="max-height: 70vh; display: flex;">
            <edit-table 
                id="tabla-demo" 
                show-tree="false" 
                parentkey="parent" 
                key="name" 
                style="width: 100%;" 
                control-styles="tr td{font-size:.8rem;} th{font-size:.8rem;} thead{ background-color: #ededed; } .EdiTable-Cell{ outline: 1px solid #EDEDED !important; } tbody{ background-color: #FFF !important; } #__table_input{ font-size: unset !important; }" 
                data='[{"name": "Sesenta","value": 60,"even": "Si","notes": "","parent": "Numeros"},{"name": "Catorce punto tres","value": 14.3,"even": "No","notes": "","parent": "Catorce"},{"name": "Catorce punto ocho","value": 14.8,"even": "Si","notes": "","parent": "Catorce"},{"name": "Cincuenta y cuatro punto uno","value": 54.1,"even": "No","notes": "","parent": "Cincuenta y cuatro"},{"name": "Diez","value": 10,"even": "Si","notes": "","parent": "Numeros"},{"name": "Noventa y cinco","value": 95,"even": "No","notes": "","parent": "Noventa"},{"name": "Catorce punto cinco","value": 14.5,"even": "No","notes": "","parent": "Catorce"},{"name": "Veinte","value": 20,"even": "Si","notes": "","parent": "Numeros"},{"name": "Cincuenta","value": 50,"even": "Si","notes": "","parent": "Numeros"},{"name": "Noventa y siete","value": 97,"even": "No","notes": "","parent": "Noventa"},{"name": "Numeros","value": 100,"even": "No","notes": ""},{"name": "Ochenta y nueve","value": 89,"even": "No","notes": "","parent": "Ochenta"},{"name": "Catorce punto dos","value": 14.2,"even": "Si","notes": "","parent": "Catorce"},{"name": "Setenta","value": 70,"even": "Si","notes": "","parent": "Numeros"},{"name": "Cuarenta","value": 40,"even": "Si","notes": "","parent": "Numeros"},{"name": "Treinta y nueve","value": 39,"even": "No","notes": "","parent": "Treinta"},{"name": "Dos","value": 2,"even": "Si","notes": "","parent": "Cero"},{"name": "Treinta","value": 30,"even": "Si","notes": "","parent": "Numeros"},{"name": "Cincuenta y cuatro","value": 54,"even": "Si","notes": "","parent": "Cincuenta"},{"name": "Noventa","value": 90,"even": "Si","notes": "","parent": "Numeros"},{"name": "Seis","value": 6,"even": "Si","notes": "","parent": "Cero"},{"name": "Cuarenta y dos","value": 42,"even": "Si","notes": "","parent": "Cuarenta"},{"name": "Cinco","value": 5,"even": "No","notes": "","parent": "Cero"},{"name": "Cero","value": 0,"even": "No","notes": "","parent": "Numeros"},{"name": "Catorce punto uno","value": 14.1,"even": "No","notes": "","parent": "Catorce"},{"name": "Ochenta","value": 80,"even": "Si","notes": "","parent": "Numeros"},{"name": "Nueve","value": 9,"even": "No","notes": "","parent": "Cero"},{"name": "Catorce","value": 14,"even": "Si","notes": "","parent": "Diez"},{"name": "Simbolos","value": "*-*","even": "No","notes": ""},{"name": "Ochenta y ocho","value": 88,"even": "Si","notes": "","parent": "Ochenta"},{"name": "Guión","value": "-","even": "No","notes": "","parent": "Simbolos"},{"name": "Catorce punto nueve","value": 14.9,"even": "No","notes": "","parent": "Catorce"},{"name": "Doce","value": 12,"even": "Si","notes": "","parent": "Diez"}]'>
                <edit-thead>
                    <edit-tr>
                        <edit-th type="Number" field="value">Valor</edit-th>
                        <edit-th type="Text" field="name" button="true" buttondata='<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-search" viewBox="0 0 16 16"><path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"/></svg>'>
                            Nombre
                        </edit-th>
                        <edit-th type="Select" field="even" options='{"No":"No","Si":"Si"}'>¿Es par?</edit-th>
                        <edit-th type="Memo" field="notes" button="true">
                            Notas
                        </edit-th>
                    </edit-tr>
                </edit-thead>
            </edit-table>
        </div>
    </div>

    <script>
        var table = document.querySelector('#tabla-demo');
        
        document.addEventListener('DOMContentLoaded', () => 
        {
            table = document.querySelector('#tabla-demo');
        });

        function copyData()
        {
            navigator.clipboard.writeText(JSON.stringify(document.querySelector('#tabla-demo').DataArray)).then(()=>{
                console.log('¡Datos copiados al portapapeles!');
            }, ()=> {
                console.log('¡Ocurrió un error al copiar los datos!');
            });
        }
        function viewTree(tree=true)
        {
            table.ShowAsTree = tree;
            table._printTreeData();
        }
        function expand()
        {
            table.ExpandRow();
        }
        function collapse()
        {
            table.CollapseRow();
        }
        function addIdent(add=true)
        {
            const row = table.GetTrByIndex(table.CurrentRowIndex());
            table.RowIndent(row, add);
        }
    </script>
</body>
</html>
