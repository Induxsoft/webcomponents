<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EdiTable Demo</title>
    <script src="induxsoft.controls.editable.js"></script>
</head>
<body style="font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;">
    <div style="max-width: 100vw; padding: 8px 16px; border: 1px solid #DDD;border-radius: 5px; padding-bottom: 32px; margin:4px;">
        
        <div style="display: flex; gap: 8px; padding: 1rem 0; align-items: center;">
            <h3 style="margin: 0;">Edit Table</h3>
            <button onclick="document.querySelector('#tabla-demo').AddRow();" style="color: #888;">+</button>
            <button onclick="copyData()" style="color: #000;">Copiar datos</button>
        </div>

        <div style="max-height: 50vh; display: flex;">
            <edit-table control-styles="tr td{height: 2rem !important;}" id="tabla-demo" style="width: 100%;" data='[{"solo_adultos":"No","titulo":"El hombre araña","director":"Sam Raimi","id_genero":"01","genero":"Acción","sinopsis":"","estreno":"2006-09-03","tipo":"Live Action"}]'>
                <edit-thead>
                    <edit-tr>
                        <edit-th type="Text" field="titulo">Título</edit-th>
                        <edit-th type="Text" field="director">Director</edit-th>
                        <edit-th type="Select" field="genero" options='{"01":"Acción","02":"Drama","03":"Comedia","04":"Historia"}'>Género</edit-th>
                        <edit-th type="Memo" field="sinopsis">Sinopsis</edit-th>
                        <edit-th type="Date" field="estreno">F. Estreno</edit-th>
                        <edit-th type="Number" field="recaudacion">Dinero recaudado</edit-th>
                        <edit-th type="Check" field="solo_adultos" default="No">Solo adultos</edit-th>
                        <edit-th>País</edit-th> <!-- Intencionalmente la columna index=7 (País) no actualiza al objeto subyacente -->
                        <edit-th type="Custom" field="estrellas">Calificación</edit-th>
                        <edit-th type="Select" field="posicion" options='{"1":"Primero","2":"Segundo","3":"Tercero","4":"Cuarto","5":"Quinto"}'>Lugar por Ingresos</edit-th>
                        <edit-th type="Select" field="tipo" options='{"Live Action":"Live Action","Animación":"Animación"}'>Tipo de película</edit-th>
                        <edit-th type="Select" keyfield="opcion_clave" options='{"a":"Opción 1","b":"Opción 2","c":"Opción 3","d":"Opción 4"}'>Opciones</edit-th>
                    </edit-tr>
                </edit-thead>
                <edit-tbody>
                    <edit-tr>
                        <edit-td>El hombre araña</edit-td>
                        <edit-td>Sam Raimi</edit-td>
                        <edit-td>Acción</edit-td>
                        <edit-td></edit-td>
                        <edit-td>2006-09-03</edit-td>
                        <edit-td></edit-td>
                        <edit-td>No</edit-td>
                        <edit-td></edit-td>
                        <edit-td></edit-td>
                        <edit-td></edit-td>
                        <edit-td>Live Action</edit-td>
                        <edit-td></edit-td>
                    </edit-tr> 
                </edit-tbody>
            </edit-table>
        </div>
    </div>


    <script>
        function copyData()
        {
            navigator.clipboard.writeText(JSON.stringify(document.querySelector('#tabla-demo').DataArray)).then(()=>{
                console.log('¡Datos copiados al portapapeles!');
            }, ()=> {
                console.log('¡Ocurrió un error al copiar los datos!');
            });
        }
        document.addEventListener('DOMContentLoaded', () => 
        {
            var table = document.querySelector('#tabla-demo');

            table.Events[table.EdiTable.Const.Events.EnterCell]=function(e)
            {
                console.log("Tabla:"+e.sender.tableId);
                console.log("Fila:"+e.sender.CurrentRowIndex().toString()+", Columna:"+e.sender.CurrentColIndex().toString());
            };

            //Ejemplo de implementación de la edición usando una columna personalizada
            table.Events[table.EdiTable.Const.Events.StartEdition]=function(e)
            {
                if (e.coldef.field=="estrellas")
                {
                    let obj=e.sender.DataArray[e.sender.RowIndexOfTd(e.td)];

                    let contador=parseInt(obj[e.coldef.field]);

                    if (isNaN(contador))
                        contador=0;

                    contador++;
                    obj[e.coldef.field]=contador;

                    //  Para actualizar la tabla, se puede optar por:
                    //  1-Actualizar el objeto subyacente y luego toda la fila:
                    //  La ventaja de actualizar toda la fila es que se pueden actualizar valores a otras columnas
                    if (contador==4)
                        obj["director"]="CUATRO";

                    e.sender.UpdateRow(e.sender.RowIndexOfTd(e.td));

                    //  2-O confirmar la edición de la celda:
                    // e.sender.ConfirmEdit(e.td,contador.toString());

                    e.sender.CellFocus(e.td); //Esta línea vuelve a seleccionar la celda editada
                }
            }

            //Ejemplo de validación de entrada y almacenamiento de la clave de una opción de Select en un miembro
            table.Events[table.EdiTable.Const.Events.BeforeUpdateCell]=function(e)
            {
                if (e.text=="juan" && e.coldef.field=="titulo")
                {
                    alert("NO debes escribir juan en la columna 'Título'");
                    e.cancel=true;
                }
                if (e.coldef.field=="genero")
                {
                    var combo=e.input;
                    if (combo.selectedIndex<0)
                        e.text="";
                    else
                        e.text=combo.options[combo.selectedIndex].text;
                        
                    e.sender.UpdateDataMember (e.sender.RowIndexOfTd(e.td),"id_genero",e.input.value);
                }
            };
            //Usa la clave almacenada para establecer el valor del Select
            table.Events[table.EdiTable.Const.Events.BeforeSetInput]=function(e){
                if (e.coldef.field=="genero")
                {
                    e.text=e.sender.DataArray[e.sender.RowIndexOfTd(e.td)].id_genero;
                }
            };
        });
    </script>
</body>
</html>
