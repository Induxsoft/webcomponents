<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Piloto: captura de documento de venta · EdiTable</title>
<link rel="stylesheet" href="_comun/demo.css">
<script src="../../src/js/induxsoft.controls.editable.js"></script>
<script src="_comun/datos.js"></script>
<script src="_comun/demo.js"></script>

</head>
<body>
<!-- Paquete V12 "ventas": partidas con totales en el pie, calc en cantidad y precio, columnas fijas (código y descripción) y diseño recordado. Datos ficticios. -->
<div id="contenido">
<div class="demo-barra"><strong>Cliente:</strong> Abarrotes La Ficticia · RFC XAXX010101000 · Lista de precios 1</div><div class="demo-caja" style="max-width:900px;overflow:auto"><edit-table id="venta-partidas" style="width:1100px" >
<edit-thead><edit-tr>
<edit-th type="Text" field="codigo" width="110px" fixed="left">Código</edit-th>
<edit-th type="NoEditable" field="descripcion" width="240px" fixed="left">Descripción</edit-th>
<edit-th type="Number" field="cantidad" textalign="end" width="90px" calc="true" default="1" summary="sum">Cantidad</edit-th>
<edit-th type="NoEditable" field="unidad" width="70px">Unidad</edit-th>
<edit-th type="Number" field="precio" textalign="end" format="true" decs="2" prefix="$" thousandssep="true" width="120px" calc="true">Precio</edit-th>
<edit-th type="Number" field="descuento" textalign="end" width="90px" mask="percent" sufix=" %">Desc.</edit-th>
<edit-th type="NoEditable" field="iva" textalign="end" format="true" decs="2" prefix="$" thousandssep="true" width="110px" summary="sum">IVA</edit-th>
<edit-th type="NoEditable" field="importe" textalign="end" format="true" decs="2" prefix="$" thousandssep="true" width="130px" summary="sum" summary-label="Total {value}">Importe</edit-th>
</edit-tr></edit-thead>
</edit-table></div>
</div>
<script>
Demo.pagina({"titulo": "Piloto: captura de documento de venta", "tipo": "v2", "bajada": "Paquete V12 \"ventas\": partidas con totales en el pie, calc en cantidad y precio, columnas fijas (código y descripción) y diseño recordado. Datos ficticios."});
Demo.requiere(["summary", "mask", "calc", "fixed", "layout"]);
Demo.observar('venta-partidas');
document.addEventListener('DOMContentLoaded', () => {
  const t = document.getElementById('venta-partidas');
  const calc = (r) => { const base = Number(r.cantidad || 0) * Number(r.precio || 0) * (1 - Number(r.descuento || 0) / 100); r.iva = Math.round(base * 16) / 100; r.importe = Math.round(base * 116) / 100; return r; };
  t.DataArray = DatosDemo.productos(6).map(p => calc({ codigo: p.codigo, descripcion: p.descripcion, cantidad: '2', unidad: p.unidad, precio: String(p.precio), descuento: '0' }));
  t._printRows();
  t.addEventListener('fieldupdated', (e) => { calc(t.DataArray[e.row]); t.UpdateRow(e.row); Demo.llamar(t, 'RefreshSummaries'); });
  t.NavTo(0, 2);
});
</script>
</body>
</html>
