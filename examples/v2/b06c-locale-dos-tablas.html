<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Locale: dos tablas, es-MX y es-CO · EdiTable</title>
<link rel="stylesheet" href="_comun/demo.css">
<script src="../../src/js/induxsoft.controls.editable.js"></script>
<script src="../../src/js/induxsoft.controls.excel.js"></script>
<script src="_comun/datos.js"></script>
<script src="_comun/demo.js"></script>

</head>
<body>
<!-- R7 y C16: cada tabla declara su locale (locale="es-MX" y locale="es-CO"; un lang heredado no cambia la presentación, P29). La de México muestra $1,234.50; la de Colombia, $1.234,50, acepta 1234,5 en su editor y ambas se exportan con valores numéricos correctos en un mismo libro; toCSV usa coma o punto y coma según el locale. -->
<div id="contenido">
<div class="demo-barra" id="barra"></div><section lang="es-MX"><h3>México (locale="es-MX")</h3><div class="demo-caja"><edit-table id="mx" style="width:100%" locale="es-MX">
<edit-thead><edit-tr>
<edit-th type="Text" field="concepto">Concepto</edit-th>
<edit-th type="Number" field="importe" textalign="end" format="true" decs="2" prefix="$" thousandssep="true">Importe</edit-th>
<edit-th type="Date" field="fecha">Fecha</edit-th>
</edit-tr></edit-thead>
</edit-table></div></section><section lang="es-CO"><h3>Colombia (locale="es-CO")</h3><div class="demo-caja"><edit-table id="co" style="width:100%" locale="es-CO">
<edit-thead><edit-tr>
<edit-th type="Text" field="concepto">Concepto</edit-th>
<edit-th type="Number" field="importe" textalign="end" format="true" decs="2" prefix="$" thousandssep="true">Importe</edit-th>
<edit-th type="Date" field="fecha">Fecha</edit-th>
</edit-tr></edit-thead>
</edit-table></div></section><pre class="demo-salida" id="salida"></pre>
</div>
<script>
Demo.pagina({"titulo": "Locale: dos tablas, es-MX y es-CO", "tipo": "v2", "bajada": "R7 y C16: cada tabla declara su locale (locale=\"es-MX\" y locale=\"es-CO\"; un lang heredado no cambia la presentación, P29). La de México muestra $1,234.50; la de Colombia, $1.234,50, acepta 1234,5 en su editor y ambas se exportan con valores numéricos correctos en un mismo libro; toCSV usa coma o punto y coma según el locale."});

Demo.observar('co');
document.addEventListener('DOMContentLoaded', () => {
  const mx = document.getElementById('mx'), co = document.getElementById('co');
  mx.DataArray = [{ concepto: 'Venta', importe: 1234.5, fecha: '2026-02-01' }, { concepto: 'Flete', importe: '980.10', fecha: '2026-02-15' }]; mx._printRows();
  co.DataArray = [{ concepto: 'Venta', importe: 1234.5, fecha: '2026-02-01' }, { concepto: 'Flete', importe: '980.10', fecha: '2026-02-15' }]; co._printRows();
  const hay = typeof InduxsoftExcel !== 'undefined';
  if (!hay) { const d = document.createElement('div'); d.className = 'demo-aviso'; d.innerHTML = '<strong>Función no disponible en esta versión</strong>No se encontró src/js/induxsoft.controls.excel.js (InduxsoftExcel). El formato por locale de la tabla es de la versión 2 (C16).'; document.getElementById('avisos').appendChild(d); }
  Demo.boton('barra', 'Exportar las dos (un libro)', () => hay && InduxsoftExcel.workbook([{ name: 'México', source: mx }, { name: 'Colombia', source: co }]).download('dos-locales.xlsx'));
  Demo.boton('barra', 'toCSV de cada una', () => { if (hay) document.getElementById('salida').textContent = InduxsoftExcel.toCSV(mx) + '\n\n' + InduxsoftExcel.toCSV(co); });
});
</script>
</body>
</html>
