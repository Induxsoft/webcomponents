<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reordenar columnas · EdiTable</title>
<link rel="stylesheet" href="_comun/demo.css">
<script src="../../src/js/induxsoft.controls.editable.js"></script>
<script src="_comun/datos.js"></script>
<script src="_comun/demo.js"></script>

</head>
<body>
<!-- column-reorder="true": se arrastra el encabezado a otra posición (indicador et-drop-indicator) o con Ctrl+Mayús+flechas sobre el encabezado enfocado. Columns, encabezado, celdas y pie se mueven juntos. reorder="false" bloquea una columna; BeforeColumnMove se puede cancelar. -->
<div id="contenido">
<div class="demo-barra" id="barra"><label><input type="checkbox" id="bloq"> Cancelar movimientos de Precio (BeforeColumnMove)</label></div><div class="demo-caja"><edit-table id="t1" style="width:100%" column-reorder="true">
<edit-thead><edit-tr>
<edit-th type="Text" field="codigo" width="100px" reorder="false">Código</edit-th>
<edit-th type="Text" field="descripcion" minwidth="200px">Descripción</edit-th>
<edit-th type="Text" field="linea">Línea</edit-th>
<edit-th type="Text" field="marca">Marca</edit-th>
<edit-th type="Number" field="existencia" textalign="end" summary="sum">Existencia</edit-th>
<edit-th type="Number" field="precio" textalign="end" format="true" decs="2" prefix="$" thousandssep="true" summary="avg" summary-label="Prom. {value}">Precio</edit-th>
</edit-tr></edit-thead>
</edit-table></div>
</div>
<script>
Demo.pagina({"titulo": "Reordenar columnas", "tipo": "v2", "bajada": "column-reorder=\"true\": se arrastra el encabezado a otra posición (indicador et-drop-indicator) o con Ctrl+Mayús+flechas sobre el encabezado enfocado. Columns, encabezado, celdas y pie se mueven juntos. reorder=\"false\" bloquea una columna; BeforeColumnMove se puede cancelar."});
Demo.requiere(["reorder"]);
Demo.observar('t1');
document.addEventListener('DOMContentLoaded', () => {
  const t = document.getElementById('t1');
  t.DataArray = DatosDemo.productos(10); t._printRows();
  t.addEventListener('BeforeColumnMove', (e) => { if (document.getElementById('bloq').checked && e.field === 'precio') e.cancel = true; });
  Demo.boton('barra', 'MoveColumn("precio", 1)', () => Demo.llamar(t, 'MoveColumn', 'precio', 1));
  Demo.boton('barra', 'Orden de Columns', () => Demo.log(t.Columns.map(c => c.field).join(', '), 'Columns'));
});
</script>
</body>
</html>
