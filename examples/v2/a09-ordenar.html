<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ordenar con clic en el encabezado · EdiTable</title>
<link rel="stylesheet" href="_comun/demo.css">
<script src="../../src/js/induxsoft.controls.editable.js"></script>
<script src="_comun/datos.js"></script>
<script src="_comun/demo.js"></script>

</head>
<body>
<!-- Un clic ordena ascendente y otro descendente. OnSort se dispara antes de ordenar con {th, coldef, caption}, como lo usa V12 para su leyenda. sorTable="false" lo desactiva. -->
<div id="contenido">
<p id="leyenda" class="demo-nota">Mostrando 12 registros</p><div class="demo-caja"><edit-table id="t1" style="width:100%" >
<edit-thead><edit-tr>
<edit-th type="Text" field="codigo" width="100px">Código</edit-th>
<edit-th type="Text" field="descripcion" minwidth="220px">Descripción</edit-th>
<edit-th type="Text" field="linea">Línea</edit-th>
<edit-th type="Number" field="existencia" textalign="end">Existencia</edit-th>
<edit-th type="Number" field="precio" textalign="end" format="true" decs="2" prefix="$" thousandssep="true">Precio</edit-th>
</edit-tr></edit-thead>
</edit-table></div><h3>Con sorTable="false"</h3><div class="demo-caja"><edit-table id="t2" style="width:100%" sorTable="false">
<edit-thead><edit-tr>
<edit-th type="Text" field="codigo" width="100px">Código</edit-th>
<edit-th type="Text" field="descripcion" minwidth="220px">Descripción</edit-th>
<edit-th type="Text" field="linea">Línea</edit-th>
<edit-th type="Number" field="existencia" textalign="end">Existencia</edit-th>
<edit-th type="Number" field="precio" textalign="end" format="true" decs="2" prefix="$" thousandssep="true">Precio</edit-th>
</edit-tr></edit-thead>
</edit-table></div>
</div>
<script>
Demo.pagina({"titulo": "Ordenar con clic en el encabezado", "tipo": "actual", "bajada": "Un clic ordena ascendente y otro descendente. OnSort se dispara antes de ordenar con {th, coldef, caption}, como lo usa V12 para su leyenda. sorTable=\"false\" lo desactiva."});

Demo.observar('t1');
document.addEventListener('DOMContentLoaded', () => {
  const t = document.getElementById('t1'), t2 = document.getElementById('t2');
  t.DataArray = DatosDemo.productos(12); t._printRows();
  t2.DataArray = DatosDemo.productos(4); t2._printRows();
  t.Events[t.EdiTable.Const.Events.OnSort] = (e) => { document.getElementById('leyenda').textContent = 'Mostrando ' + t.DataArray.length + ' registros ordenados por ' + e.caption + ' ' + e.coldef.sort; };
});
</script>
</body>
</html>
